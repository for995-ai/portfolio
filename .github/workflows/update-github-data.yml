name: Update GitHub snapshot

# Refreshes public/data/github.json so the site never calls the GitHub API from
# a visitor's browser, then rebuilds and redeploys the site in the SAME run.
#
# Why deploy here rather than let the commit trigger deploy-pages.yml:
# commits pushed with GITHUB_TOKEN deliberately do not trigger further
# workflow runs, so a separate on:push deploy would never fire and the live
# site would keep serving a stale snapshot. Doing both here removes that
# dependency entirely — no PAT is used just to trigger a build.
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write        # commit the refreshed snapshot
  pages: write           # publish the rebuilt site
  id-token: write        # required by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # No `token:` input, so the push below is authenticated by the
        # workflow token, never by a personal one.
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate snapshot
        # Verified 2026-08-16: the built-in workflow token CAN read this
        # account's PUBLIC contributionCalendar, so no personal access token
        # is needed and none is configured. No `repo` scope is requested and
        # no private repository content is ever read.
        #
        #   SNAPSHOT_TOKEN — REST only, purely to lift the anonymous rate
        #                    limit (Actions runners share outbound IPs).
        #   GRAPHQL_TOKEN  — the PUBLIC contribution calendar only.
        #
        # Token values are never echoed or written to the JSON.
        env:
          SNAPSHOT_TOKEN: ${{ github.token }}
          GRAPHQL_TOKEN: ${{ github.token }}
        run: node scripts/update-github-snapshot.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/github.json; then
            echo "snapshot unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/github.json
          git commit -m "chore: refresh GitHub snapshot"
          git push

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
